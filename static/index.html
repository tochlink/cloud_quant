<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QTW · 量化交易控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%234b3aa6'/%3E%3Cpath d='M7 21l6-6 4 4 8-9' stroke='%2373f0e0' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-arcs" aria-hidden="true">
    <svg viewBox="0 0 600 400" preserveAspectRatio="none"><path d="M120 400 C 220 230, 420 180, 600 210"/><path d="M180 400 C 270 260, 450 230, 600 250"/><path d="M60 400 C 200 200, 400 120, 600 150"/></svg>
  </div>

  <div class="stage">
    <nav class="sidebar" id="sidebar" aria-label="主导航"></nav>

    <div class="shell" id="shell">
      <main class="main">
        <header class="topbar">
          <div>
            <h1 class="greet" id="greet">晚上好，kean</h1>
            <div class="sub" id="pageSub">系统化纸面 / 研究工具 · 不构成投资建议</div>
          </div>
          <div class="top-actions">
            <span class="mode-badge" id="modeBadge">纸面模式</span>
            <label class="switcher" title="账户">
              <select id="accountSel" aria-label="切换账户">
                <option value="paper">模拟盘 · 纸面账本</option>
                <option value="okx">交易所 · OKX</option>
                <option value="gate">交易所 · Gate.io</option>
              </select>
              <svg class="chev" viewBox="0 0 24 24"><path d="M8 10l4-4 4 4M8 14l4 4 4-4"/></svg>
            </label>
            <button class="sq-btn" id="runNowBtn" title="立即执行一次系统化周期（纸面）"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2M3 9h13a2 2 0 0 0 0-3"/></svg></button>
          </div>
        </header>
        <section class="page" id="page"></section>
      </main>

      <aside class="rpanel" id="rpanel">
        <div class="r-top">
          <button class="ico-btn" id="noticeBtn" title="系统消息"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/></svg></button>
          <button class="ico-btn" id="bellBtn" title="运行状态"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><i class="dot" id="bellDot"></i></button>
          <div class="avatar" title="kean">K</div>
        </div>
        <div class="r-head">
          <h2 id="rTitle">持仓</h2>
          <button class="ico-btn sm" id="rSearchBtn" title="搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></button>
        </div>
        <input class="r-search hidden" id="rSearch" placeholder="搜索币种…" />
        <div class="r-sub" id="rSub">—</div>
        <div class="r-list" id="rList"></div>
        <div class="r-alert" id="rAlert">
          <svg class="wave" viewBox="0 0 300 160" preserveAspectRatio="none"><path d="M0 70 C 80 10, 160 120, 300 40 L300 160 L0 160Z"/></svg>
          <div class="bell"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/><path d="M3 6l2 1M21 6l-2 1M12 2v1"/></svg></div>
          <div class="r-alert-text" id="rAlertText">加载中…</div>
          <div class="r-alert-actions">
            <button class="kill" id="killBtn" title="紧急停止：平掉全部纸面持仓并关闭自动交易">紧急停止</button>
            <button class="round-go" id="alertGo" title="查看信号"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal hidden" id="modal"><div class="modal-card" id="modalCard"></div></div>

  <script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
  <script src="/static/charts.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
